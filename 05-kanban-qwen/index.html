<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カンバンボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="app-title">
    <h1>カンバンボード</h1>
    <button id="add-column-btn" class="btn btn-secondary">＋ カラム追加</button>
  </div>
  <div class="search-box">
    <label for="search-input">検索</label>
    <input type="search" id="search-input" placeholder="カードを検索（タイトル・説明）">
  </div>
</header>

<main id="board" class="board" aria-label="カンバンボード"></main>

<dialog id="card-dialog" class="card-dialog">
  <form id="card-form">
    <input type="hidden" id="card-id">
    <h2 id="card-dialog-title">新規カード</h2>
    <label>タイトル
      <input type="text" id="card-title" required>
    </label>
    <label>詳細説明
      <textarea id="card-desc" rows="4"></textarea>
    </label>
    <label>ラベル色
      <select id="card-label">
        <option value="">なし</option>
      </select>
    </label>
    <label>期限日
      <input type="date" id="card-due">
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn btn-danger" id="card-delete-btn">削除</button>
      <button type="button" class="btn" id="card-cancel-btn">キャンセル</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
