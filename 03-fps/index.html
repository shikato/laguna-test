<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoomライクFPS</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #hud { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; font-size: 16px; }
    #hud div { margin-bottom: 4px; }
    #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
    .hair { display: inline-block; }
    .hair.h { width: 18px; height: 2px; background: rgba(255,255,255,0.6); position: relative; top: -1px; }
    .hair.v { position: absolute; top: -9px; width: 2px; height: 18px; background: rgba(255,255,255,0.6); left: 50%; }
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: none; align-items: center; justify-content: center; flex-direction: column; }
    #overlay h1 { font-size: 48px; margin-bottom: 16px; }
    #overlay p { font-size: 20px; opacity: 0.8; }
    #guides { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 9; color: rgba(255,255,255,0.85); font-size: 13px; background: rgba(0,0,0,0.45); padding: 6px 14px; border-radius: 6px; }
    #damageFlash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.55); opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.1s; }
    .hp-hit { color: #ff4444; animation: hpPulse 0.5s; }
    @keyframes hpPulse { 0% { color: #ff4444; text-shadow: 0 0 8px #fff; } 100% { color: #fff; text-shadow: none; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div>HP: <span id="hp">100</span></div>
    <div>AMMO: <span id="ammo">30</span></div>
    <div>SCORE: <span id="score">0</span></div>
  </div>
  <div id="crosshair"><span class="hair h"></span><span class="hair v"></span></div>
  <div id="overlay"><h1 id="overlay-title"></h1><p id="overlay-sub"></p></div>
  <div id="damageFlash"></div>
  <div id="guides">WASD: 移動 / マウス: 視点 / クリック or F: 射撃 / R: リロード</div>
  <script type="module" src="main.js"></script>
</body>
</html>
